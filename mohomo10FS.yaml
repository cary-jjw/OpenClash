  - RULE-SET,TikTok,📀 流媒体
  - RULE-SET,YouTube_1,📀 流媒体
  - RULE-SET,YouTube_2,📀 流媒体
  - RULE-SET,HBO,📀 流媒体
  - RULE-SET,Disney,📀 流媒体
  - RULE-SET,Netflix,📀 流媒体
  - RULE-SET,Spotify,📀 流媒体
  - RULE-SET,GuowaiProxy,🌍 国外
  - MATCH,节点选择
