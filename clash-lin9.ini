;2、节点组（细化可用地区，过滤 v6 及超时节点）
custom_proxy_group=香港-自动`url-test`^(?=.*(港|香港|HK|Hong Kong|🇭🇰))(?!.*v6).*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group=台湾-自动`url-test`^(?=.*(台|台湾|台灣|TW|Taiwan|🇹🇼))(?!.*v6).*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group=日本-自动`url-test`^(?=.*(日|日本|JP|Japan|🇯🇵))(?!.*v6).*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group=新加坡-自动`url-test`^(?=.*(新|新加坡|SG|Singapore|🇸🇬))(?!.*v6).*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group=美国-自动`url-test`^(?=.*(美|美国|US|United States|🇺🇸))(?!.*v6).*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group=韩国-自动`url-test`^(?=.*(韩|韩国|KR|Korea|🇰🇷))(?!.*v6).*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group=欧洲-自动`url-test`^(?=.*(英|法|荷|德|土耳其|GB|UK|FR|NL|DE|TR|🇬🇧|🇫🇷|🇳🇱|🇩🇪))(?!.*v6).*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group=官直及专线-自动`url-test`^(?=.*(官直|铁塔))(?!.*v6).*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group=AI-自动`url-test`^(?=.*(GPT|ChatGPT|OpenAI|美国|US|🇺🇸|SG|🇸🇬|JP|🇯🇵|KR|🇰🇷))(?!.*v6).*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group=所有-自动`url-test`^(?!.*(v6|超时|DIRECT|REJECT)).*$`http://www.gstatic.com/generate_204`300,,20

;3、策略组
custom_proxy_group=🎡 AC`select`[]美国-自动`[]香港-自动`[]日本-自动`[]新加坡-自动`[]欧洲-自动`[]官直及专线-自动`[]所有-自动`[]REJECT
custom_proxy_group=🎡 GN`select`[]DIRECT`[]REJECT
custom_proxy_group=📘 GitHub`select`[]美国-自动`[]香港-自动`[]日本-自动`[]新加坡-自动`[]欧洲-自动`[]所有-自动`[]REJECT
custom_proxy_group=👽 AI`select`[]AI-自动`[]美国-自动`[]新加坡-自动`[]日本-自动`[]韩国-自动`[]REJECT
custom_proxy_group=📀 流媒体`select`[]美国-自动`[]香港-自动`[]日本-自动`[]新加坡-自动`[]欧洲-自动`[]所有-自动`[]REJECT
custom_proxy_group=🌍 国外`url-test`^(?=.*(美国|US|🇺🇸|香港|HK|🇭🇰|日本|JP|🇯🇵|新加坡|SG|🇸🇬|英|法|荷))(?!.*v6).*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group=➡️ 国内`select`[]DIRECT`[]REJECT

