port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome

dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# ==================== 策略组 ====================
proxy-groups:
  # 手动总开关
  - name: 节点选择
    type: select
    proxies:
      - 🌍 国外
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 美国-自动
      - 韩国-自动
      - 所有-自动
      - 手动选择
      - DIRECT

  # 地区自动测速组（参考 111 文件的 include-all-proxies 写法，完美避开 proxies 缺失报错）
  - name: 所有-自动
    type: url-test
    include-all-proxies: true
    exclude-type: direct
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20
    empty-fallback: REJECT

  - name: 香港-自动
    type: url-test
    include-all-proxies: true
    filter: "(?i)HK|Hong|香港|港"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20
    empty-fallback: REJECT

  - name: 台湾-自动
    type: url-test
    include-all-proxies: true
    filter: "(?i)TW|Taiwan|台湾|臺|台"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20
    empty-fallback: REJECT

  - name: 日本-自动
    type: url-test
    include-all-proxies: true
    filter: "(?i)JP|Japan|日本|日"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20
    empty-fallback: REJECT

  - name: 新加坡-自动
    type: url-test
    include-all-proxies: true
    filter: "(?i)SG|Singapore|新加坡|新"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20
    empty-fallback: REJECT

  - name: 美国-自动
    type: url-test
    include-all-proxies: true
    filter: "(?i)US|United States|美国|美"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20
    empty-fallback: REJECT

  - name: 韩国-自动
    type: url-test
    include-all-proxies: true
    filter: "(?i)KR|Korea|韩国|韩"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20
    empty-fallback: REJECT

  - name: 🌍 国外
    type: url-test
    include-all-proxies: true
    filter: "(?i)香港|韩国|台湾|日本|新加坡|美国|马来西亚|越南|加拿大"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20
    empty-fallback: REJECT

  - name: 手动选择
    type: select
    include-all-proxies: true

  # 你最开始要求的业务分流组
  - name: 🎡 AC
    type: select
    proxies:
      - 🌍 国外
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 美国-自动
      - 韩国-自动
      - 所有-自动
      - REJECT

  - name: 🎡 GN
    type: select
    proxies:
      - DIRECT
      - REJECT

  - name: 🙋 Telegram
    type: select
    proxies:
      - DIRECT
      - 所有-自动
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 美国-自动
      - REJECT

  - name: 📘 GitHub
    type: select
    proxies:
      - 🌍 国外
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 美国-自动
      - 韩国-自动
      - 所有-自动
      - REJECT

  - name: 👽 AI
    type: select
    proxies:
      - 美国-自动
      - 新加坡-自动
      - 日本-自动
      - 韩国-自动
      - REJECT

  - name: 📀 流媒体
    type: select
    proxies:
      - 🌍 国外
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 美国-自动
      - 韩国-自动
      - 所有-自动
      - REJECT

