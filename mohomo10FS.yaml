# ==================== Mihomo 最终完美版配置模板 ====================

port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

# ==================== 1、策略组（Proxy Groups） ====================
proxy-groups:
  # 🛑 关键：将最基础、自带 proxies 的组放在数组第一位（索引 [0]），彻底杜绝 proxies missing 报错
  - name: ➡️ 国内
    type: select
    proxies:
      - DIRECT
      - REJECT

  # --- 核心自动测速组 ---
  - name: 所有-自动
    type: url-test
    include-all: true
    filter: ".*"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20

  - name: 香港-自动
    type: url-test
    include-all: true
    filter: "(?i)HK|Hong|香港|港"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20

  - name: 台湾-自动
    type: url-test
    include-all: true
    filter: "(?i)TW|Taiwan|台湾|臺|台"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20

  - name: 日本-自动
    type: url-test
    include-all: true
    filter: "(?i)JP|Japan|日本|日"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20

  - name: 新加坡-自动
    type: url-test
    include-all: true
    filter: "(?i)SG|Singapore|新加坡|新"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20

  - name: 美国-自动
    type: url-test
    include-all: true
    filter: "(?i)US|United States|美国|美"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20

  - name: 韩国-自动
    type: url-test
    include-all: true
    filter: "(?i)KR|Korea|韩国|韩"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20

  - name: 🌍 国外
    type: url-test
    include-all: true
    filter: "(?i)香港|韩国|台湾|日本|新加坡|美国|马来西亚|越南|加拿大"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 20

  # --- 用户手动与分流选择组 ---
  - name: 🎡 AC
    type: select
    proxies:
      - 🌍 国外
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 美国-自动
      - 韩国-自动
      - 所有-自动
      - REJECT

  - name: 🎡 GN
    type: select
    proxies:
      - DIRECT
      - REJECT

  - name: 🙋 Telegram
    type: select
    proxies:
      - DIRECT
      - 所有-自动
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 美国-自动
      - REJECT

  - name: 📘 GitHub
    type: select
    proxies:
      - 🌍 国外
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 美国-自动
      - 韩国-自动
      - 所有-自动
      - REJECT

  - name: 👽 AI
    type: select
    proxies:
      - 美国-自动
      - 新加坡-自动
      - 日本-自动
      - 韩国-自动
      - REJECT

  - name: 📀 流媒体
    type: select
    proxies:
      - 🌍 国外
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 美国-自动
      - 韩国-自动
      - 所有-自动
      - REJECT


