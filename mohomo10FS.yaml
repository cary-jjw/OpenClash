# ==================== 规则路由 ====================
rules:
  - RULE-SET,AC,🎡 AC
  - RULE-SET,GN,🎡 GN
  - RULE-SET,AI_1,👽 AI
  - RULE-SET,AI_2,👽 AI
  - RULE-SET,GitHub,📘 GitHub
